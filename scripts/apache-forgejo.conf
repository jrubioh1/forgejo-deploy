# ==============================================================================
# /etc/apache2/vhosts.d/forgejo.conf - VirtualHost de Apache para Forgejo
# ==============================================================================
# Módulos requeridos en Gentoo (habilitar en /etc/conf.d/apache2 -> APACHE2_OPTS):
#   -D PROXY -D PROXY_HTTP -D PROXY_WSTUNNEL -D REWRITE -D SSL
# ==============================================================================

# ------------------------------------------------------------------------------
# OPCIÓN A1: VirtualHost con HTTPS y Redirección desde HTTP (Recomendado)
# ------------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName git.tudominio.com
    ServerAdmin admin@tudominio.com

    # Redirección automática de todo el tráfico HTTP a HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog /var/log/apache2/forgejo_error.log
    CustomLog /var/log/apache2/forgejo_access.log combined
</VirtualHost>

<IfDefine SSL>
<VirtualHost *:443>
    ServerName git.tudominio.com
    ServerAdmin admin@tudominio.com

    # Certificados SSL (ej. emitidos por Certbot / Let's Encrypt)
    SSLEngine on
    SSLCertificateFile /etc/ssl/apache2/server.crt
    SSLCertificateKeyFile /etc/ssl/apache2/server.key
    # SSLCertificateChainFile /etc/ssl/apache2/ca.crt

    # Parámetros para grandes cargas de ficheros Git (LFS y git push masivos)
    LimitRequestBody 0
    TimeOut 600
    ProxyTimeout 600

    ProxyPreserveHost On
    ProxyRequests Off

    # Soporte para WebSockets (notificaciones y eventos en tiempo real de Forgejo)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*)           ws://127.0.0.1:3000/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /(.*)           http://127.0.0.1:3000/$1 [P,L]

    ProxyPassReverse / http://127.0.0.1:3000/

    # Cabeceras de seguridad recomendadas
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog /var/log/apache2/forgejo_ssl_error.log
    CustomLog /var/log/apache2/forgejo_ssl_access.log combined
</VirtualHost>
</IfDefine>

